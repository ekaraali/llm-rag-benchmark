name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest numpy PyYAML requests
      - run: python -m pytest -q
      - run: python -m experiments.run_benchmark --provider mock --lexical-smoke --limit 2
