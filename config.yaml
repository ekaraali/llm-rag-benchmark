# provider: ollama | openai_compatible | mock (smoke test only)
provider: ollama
model: llama3.2:3b
base_url: http://localhost:11434
api_key_env: LLM_API_KEY
embedding_model: sentence-transformers/all-MiniLM-L6-v2
chunk_words: 100
chunk_overlap_words: 20
top_k: 3
temperature: 0.0
max_tokens: 180
pipelines: [direct, dense_rag, hybrid_reasoning_rag]
track_mlflow: true
mlflow_experiment: llm-rag-benchmark
