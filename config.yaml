# provider: ollama | openai_compatible | mock (smoke test only)
provider: ollama
model: llama3.2:3b
base_url: http://localhost:11434
api_key_env: LLM_API_KEY
embedding_model: sentence-transformers/all-MiniLM-L6-v2
chunk_words: 100
chunk_overlap_words: 20
# BM25 lexical retrieval: k1 = term-frequency saturation, b = length normalisation
bm25_k1: 1.5
bm25_b: 0.75
top_k: 3
# RAG system prompt: strict (default; abstain unless the excerpts support an answer)
# or inference (answer from straightforward inference; abstain only if nothing is relevant)
prompt_version: strict
temperature: 0.0
max_tokens: 180
# direct | dense_rag | bm25_rag | hybrid_rag (BM25 + dense fused with RRF)
pipelines: [direct, dense_rag, bm25_rag, hybrid_rag]
track_mlflow: true
mlflow_experiment: llm-rag-benchmark
# LLM-as-a-judge used by experiments/run_judge.py (calibration against human labels)
judge:
  provider: anthropic            # anthropic | openai_compatible | mock (tests only)
  model: claude-haiku-5-5
  base_url: https://api.anthropic.com
  api_key_env: ANTHROPIC_API_KEY # the key is read from this environment variable, never from files
  temperature: null              # claude-haiku-5-5 does not accept temperature; set a number for models that do
  thinking: disabled             # Haiku 5.5 thinks by default and thinking tokens count toward max_tokens
  structured_output: true        # anthropic: answer via a forced tool call with an enum schema (needs thinking disabled)
  max_tokens: 400
  price_per_mtok: {input: 0.10, output: 0.50}  # USD, for cost estimates only; check the provider's pricing page
